name: Woning monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 min (GitHub loopt soms een paar minuten achter)
  workflow_dispatch:          # handmatig starten via de Actions-tab

permissions:
  contents: write             # nodig om state.json terug te committen

concurrency:
  group: woning-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sites
        run: python monitor.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Onthoud geziene woningen
        if: always()              # ook opslaan als de check halverwege faalde
        run: |
          [ -f state.json ] || exit 0
          git config user.name "woning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "state update"
          # als je tussendoor zelf iets in de repo hebt aangepast, eerst bijwerken
          git pull --rebase && git push
