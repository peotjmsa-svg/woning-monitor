name: Housing monitor (e-mailalerts)

on:
  schedule:
    - cron: '0 */2 * * *'    # elke 2 uur (GitHub loopt soms wat achter)
  workflow_dispatch:          # handmatig testen via de Actions-tab

permissions:
  contents: write             # nodig om seen_listings.json terug te committen

concurrency:
  group: housing-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: housing_monitor/requirements.txt

      - run: pip install -r housing_monitor/requirements.txt

      - name: Claude Code installeren (voor je Claude-abonnement)
        run: npm install -g @anthropic-ai/claude-code

      - name: Alert-mails verwerken
        run: python housing_monitor/check_alerts.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Eén van beide: het abonnementstoken (claude setup-token) of een API-key.
          # Staat de API-key erin, dan wordt die gebruikt.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}

      - name: Verwerkte listings onthouden
        if: always()              # ook opslaan als een mail mislukte; de rest is dan wel verwerkt
        run: |
          f=housing_monitor/seen_listings.json
          [ -f "$f" ] || exit 0
          git config user.name "woning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "seen_listings update"
          git pull --rebase && git push
